<!doctype html>
<html lang="he" dir="rtl" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1c1917" />

  <!-- Preconnect to font origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Async Font Loading Strategy with font-display: optional for zero CLS -->
  <link
    href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=optional"
    rel="stylesheet"
    media="print"
    onload="this.media='all'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=optional"
      rel="stylesheet">
  </noscript>
</head>

<body class="font-sans antialiased selection:bg-amber-300/60">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
